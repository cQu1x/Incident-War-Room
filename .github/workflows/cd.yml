name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to VM
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, incident-vm]
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || 'latest' }}
      TARGET_REF: ${{ github.event.workflow_run.head_sha || 'origin/main' }}
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy
        working-directory: ${{ secrets.DEPLOY_PATH }}
        run: |
          export IMAGE_PREFIX="${IMAGE_PREFIX,,}"
          git fetch --prune origin
          git reset --hard "$TARGET_REF"
          docker compose pull
          docker compose up -d

      - name: Health check
        working-directory: ${{ secrets.DEPLOY_PATH }}
        run: |
          deadline=$((SECONDS + 120))
          until [ "$(docker compose ps report-service --format '{{.Health}}')" = "healthy" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "report-service did not become healthy in time"
              docker compose ps
              docker compose logs --tail=80 report-service incident-service
              exit 1
            fi
            sleep 3
          done

          state=$(docker compose ps incident-service --format '{{.State}}')
          if [ "$state" != "running" ]; then
            echo "incident-service is not running (state: ${state:-missing})"
            docker compose ps
            docker compose logs --tail=80 incident-service
            exit 1
          fi

          echo "Deploy healthy."

      - name: Prune old images
        run: docker image prune -f