name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: incident-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incident-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: incident-service/go.mod
          cache-dependency-path: incident-service/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l ./internal/ ./cmd/)"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  python:
    name: report-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest
        run: pytest -m "not integration"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"

      - name: Provide env for compose
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker compose push incident-service report-service frontend demo-app
          for name in incident-service report-service frontend demo-app; do
            docker tag "$IMAGE_PREFIX/$name:$IMAGE_TAG" "$IMAGE_PREFIX/$name:latest"
            docker push "$IMAGE_PREFIX/$name:latest"
          done
