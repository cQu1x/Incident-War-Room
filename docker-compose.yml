services:
  incident-service:
    image: ${IMAGE_PREFIX:-ghcr.io/incidentwarroom}/incident-service:${IMAGE_TAG:-latest}
    build: ./incident-service
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - REPORT_SERVICE_URL=http://report-service:8000
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      report-service:
        condition: service_healthy

  report-service:
    image: ${IMAGE_PREFIX:-ghcr.io/incidentwarroom}/report-service:${IMAGE_TAG:-latest}
    build: ./report-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c '\\q' -q"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:17-alpine
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
    volumes:
      - ./incident-service/migration:/migrations:ro
    entrypoint: ["sh", "/migrations/apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/incidentwarroom}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        # Vite inlines this into the bundle at build time, so it must be a URL
        # the browser can reach. Point it at the public domain; Caddy proxies
        # /api/* on that domain to the incident-service.
        VITE_INCIDENT_API_BASE: ${PUBLIC_BASE_URL:-https://incident-war-room.ru}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - incident-service

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-incident-war-room.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data holds the automatically issued ACME certificates; keep it
      # so certs survive container recreation.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - incident-service

  # Public ingress tunnel: the VM cannot accept inbound connections, so frpc
  # keeps an outbound connection to frps on the VPS and the VPS forwards its
  # ports 80/443 here (see frpc.toml). Requires FRP_AUTH_TOKEN in .env.
  frpc:
    image: snowdreamtech/frpc:0
    restart: unless-stopped
    environment:
      - FRP_SERVER_ADDR=${FRP_SERVER_ADDR:-91.149.238.104}
      - FRP_AUTH_TOKEN=${FRP_AUTH_TOKEN}
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - caddy

  # --- Automatic incidents from monitoring (demo stack) ---
  # demo-app is a controllable target ("Сломать"/"Починить"); Prometheus scrapes
  # it and, when demo_app_error_rate crosses the threshold, fires an alert that
  # Alertmanager posts to incident-service's /webhooks/alertmanager, opening an
  # incident. The webhook call carries the ALERTMANAGER_WEBHOOK_TOKEN.

  demo-app:
    image: ${IMAGE_PREFIX:-ghcr.io/incidentwarroom}/demo-app:${IMAGE_TAG:-latest}
    build: ./demo-app
    restart: unless-stopped
    ports:
      - "9000:9000"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - demo-app

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    depends_on:
      - incident-service

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
