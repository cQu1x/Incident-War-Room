services:
  incident-service:
    build: ./incident-service
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - REPORT_SERVICE_URL=http://report-service:8000
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      report-service:
        condition: service_healthy

  report-service:
    build: ./report-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c '\\q' -q"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:17-alpine
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
    volumes:
      - ./incident-service/migration:/migrations:ro
    entrypoint: ["sh", "/migrations/apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this into the bundle at build time, so it must be a URL
        # the browser can reach. Point it at the public domain; Caddy proxies
        # /api/* on that domain to the incident-service.
        VITE_INCIDENT_API_BASE: ${PUBLIC_BASE_URL:-https://incident-war-room.ru}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - incident-service

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-incident-war-room.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - incident-service

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
